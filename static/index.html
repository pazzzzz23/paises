<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Países · Panel de gestión</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182235;background:#f5f7fb;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-width:320px}.shell{max-width:1120px;margin:auto;padding:54px 28px 80px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:#3567df}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:9px 0 28px}.heading h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.045em;line-height:1.08;margin:0}.heading p{color:#6b778c;margin:11px 0 0}.button{border:0;border-radius:10px;background:#315fdb;color:white;padding:12px 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 5px 12px #315fdb2a;transition:transform .15s,background .15s}.button:hover{background:#244fc4;transform:translateY(-1px)}.button.secondary{background:#edf1f8;color:#293750;box-shadow:none}.button.danger{background:#fff0ef;color:#bc3f38;box-shadow:none}.button.small{padding:8px 11px;font-size:12px}.panel{background:white;border:1px solid #e7ebf2;border-radius:16px;box-shadow:0 14px 40px #24385d08;overflow:hidden}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:19px 22px;border-bottom:1px solid #edf0f5}.count{font-size:14px;color:#68758a}.search{width:min(290px,100%);border:1px solid #dfe4ed;border-radius:9px;padding:10px 12px;font:inherit;outline:none}.search:focus,input:focus,select:focus{border-color:#6688e8!important;box-shadow:0 0 0 3px #315fdb18}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8590a2;background:#fbfcfe;padding:13px 20px;white-space:nowrap}td{padding:15px 20px;border-top:1px solid #f0f2f6;font-size:14px;color:#354158;white-space:nowrap}tbody tr:hover{background:#fbfcff}.actions{display:flex;gap:8px}.empty{text-align:center;color:#7b879a;padding:54px 16px}.notice{margin:0 0 16px;padding:13px 15px;border-radius:10px;background:#fff2e5;color:#92510c;font-size:14px;display:none}.modal-backdrop{position:fixed;inset:0;background:#15213b80;display:none;align-items:center;justify-content:center;padding:20px;z-index:2}.modal-backdrop.open{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:17px;padding:26px;box-shadow:0 25px 80px #101a3260}.modal h2{margin:0 0 5px;font-size:23px;letter-spacing:-.025em}.sub{margin:0 0 22px;color:#778296;font-size:14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:700;color:#536078}.field input,.field select{width:100%;border:1px solid #dfe4ed;border-radius:9px;padding:10px 11px;font:inherit;font-size:14px;outline:none}.field.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#19263e;color:white;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:4}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.shell{padding:34px 16px}.heading{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}td,th{padding:13px 14px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Administración de datos</div>
    <div class="heading"><div><h1>Países</h1><p>Consulta y gestiona los registros de tu base de datos.</p></div><button class="button" id="addBtn">＋ Añadir país</button></div>
    <div class="notice" id="notice"></div>
    <section class="panel">
      <div class="toolbar"><span class="count" id="count">Cargando registros…</span><input class="search" id="search" type="search" placeholder="Buscar en los registros…" aria-label="Buscar"></div>
      <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
      <div class="empty" id="empty" hidden>No hay registros para mostrar.</div>
    </section>
  </main>
  <div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Añadir país</h2><p class="sub" id="modalSub">Completa los campos para crear un registro.</p><form id="recordForm"><div class="fields" id="fields"></div><div class="modal-actions"><button type="button" class="button secondary" id="cancelBtn">Cancelar</button><button class="button" type="submit" id="saveBtn">Guardar país</button></div></form></section></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const api='/api/paises';let columns=[];let records=[];let editing=null;let primaryKey='';
    const $=id=>document.getElementById(id);
    function showToast(message){const toast=$('toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2800)}
    async function request(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!response.ok){let message='Ocurrió un error.';try{message=(await response.json()).detail||message}catch{}throw new Error(message)}if(response.status===204)return null;return response.json()}
    function humanize(value){return value.replaceAll('_',' ').replace(/\b\p{L}/gu,c=>c.toUpperCase())}
    function render(){const query=$('search').value.trim().toLocaleLowerCase();const visible=records.filter(row=>Object.values(row).some(value=>String(value??'').toLocaleLowerCase().includes(query)));const shown=columns.filter(c=>!c.autoincrement||!c.primary_key);$('thead').innerHTML=`<tr>${shown.map(c=>`<th>${escapeHtml(humanize(c.name))}</th>`).join('')}<th>Acciones</th></tr>`;$('tbody').innerHTML=visible.map(row=>`<tr>${shown.map(c=>`<td>${escapeHtml(formatValue(row[c.name]))}</td>`).join('')}<td><div class="actions"><button class="button secondary small" data-edit="${escapeHtml(String(row[primaryKey]))}">Editar</button><button class="button danger small" data-delete="${escapeHtml(String(row[primaryKey]))}">Eliminar</button></div></td></tr>`).join('');$('empty').hidden=visible.length>0;$('count').textContent=`${visible.length} ${visible.length===1?'registro':'registros'}${query?' encontrados':''}`;document.querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>openForm(records.find(r=>String(r[primaryKey])===button.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>removeRecord(button.dataset.delete))}
    function formatValue(value){if(value===null||value===undefined||value==='')return '—';if(typeof value==='boolean')return value?'Sí':'No';return String(value)}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function inputType(column){if(column.python_type==='date')return 'date';if(column.python_type==='datetime')return 'datetime-local';if(['int','integer','float','decimal'].includes(column.python_type))return 'number';return 'text'}
    function openForm(record=null){editing=record;$('modalTitle').textContent=record?'Editar país':'Añadir país';$('modalSub').textContent=record?'Actualiza los datos del registro seleccionado.':'Completa los campos para crear un registro.';$('saveBtn').textContent=record?'Guardar cambios':'Guardar país';const fields=columns.filter(c=>!(c.primary_key&&(c.autoincrement||record)));$('fields').innerHTML=fields.map((column,index)=>{const id=`field-${index}`;const type=inputType(column);const value=record?.[column.name]??'';const required=!column.nullable&&!column.autoincrement;let control;if(column.python_type==='bool'){const isTrue=value===true||value===1||['true','1'].includes(String(value).toLowerCase());const isFalse=value===false||value===0||['false','0'].includes(String(value).toLowerCase());control=`<select id="${id}" name="${escapeHtml(column.name)}" ${required?'required':''}>${column.nullable?`<option value="" ${!isTrue&&!isFalse?'selected':''}>Sin valor</option>`:''}<option value="true" ${isTrue?'selected':''}>Sí</option><option value="false" ${isFalse?'selected':''}>No</option></select>`}else{control=`<input id="${id}" name="${escapeHtml(column.name)}" type="${type}" value="${escapeHtml(type==='datetime-local'?String(value).replace(' ','T').slice(0,16):value)}" ${required?'required':''} ${type==='number'?'step="any"':''} placeholder="${escapeHtml(humanize(column.name))}">`}return `<div class="field"><label for="${id}">${escapeHtml(humanize(column.name))}${required?' *':''}</label>${control}</div>`}).join('');$('backdrop').classList.add('open');$('fields').querySelector('input,select')?.focus()}
    function closeForm(){$('backdrop').classList.remove('open');editing=null}
    async function load(){try{$('notice').style.display='none';const schema=await request('/api/schema');columns=schema.columns;primaryKey=columns.find(c=>c.primary_key)?.name;if(!primaryKey)throw new Error('No se encontró la clave primaria de paises.');records=await request(`${api}?limit=500`);render()}catch(error){$('notice').textContent=`No se pudo cargar la tabla paises: ${error.message} Comprueba la configuración en .env y que MySQL esté disponible.`;$('notice').style.display='block';$('count').textContent='Conexión pendiente';$('empty').hidden=false}}
    async function removeRecord(id){if(!confirm('¿Eliminar este país? Esta acción no se puede deshacer.'))return;try{await request(`${api}/${encodeURIComponent(id)}`,{method:'DELETE'});showToast('Registro eliminado.');await load()}catch(error){showToast(error.message)}}
    $('recordForm').addEventListener('submit',async event=>{event.preventDefault();const payload=Object.fromEntries(new FormData(event.currentTarget).entries());for(const column of columns){if(column.python_type==='bool'&&Object.hasOwn(payload,column.name))payload[column.name]=payload[column.name]===''?null:['true','1','sí','si','yes'].includes(String(payload[column.name]).toLowerCase())}const recordBeingEdited=editing;try{const url=recordBeingEdited?`${api}/${encodeURIComponent(recordBeingEdited[primaryKey])}`:api;await request(url,{method:recordBeingEdited?'PUT':'POST',body:JSON.stringify(payload)});closeForm();showToast(recordBeingEdited?'Cambios guardados.':'País añadido.');await load()}catch(error){showToast(error.message)}});
    $('addBtn').onclick=()=>openForm();$('cancelBtn').onclick=closeForm;$('backdrop').onclick=event=>{if(event.target===$('backdrop'))closeForm()};$('search').oninput=render;load();
  </script>
</body>
</html>
